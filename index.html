<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>💌</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }
        
        body {
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 45%, #1b1030 0%, #0f1117 60%, #08090d 100%);
        }
        
        #letter {
            display: inline-block;
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            text-decoration: none;
            font-size: clamp(90px, 28vw, 240px);
            line-height: 1;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: transform .15s ease, filter .2s;
        }
        
        #letter:hover {
            filter: drop-shadow(0 0 24px rgba(255, 77, 141, .65));
        }
        
        #letter:active {
            transform: scale(.94);
        }
        
        #letter:focus-visible {
            outline: 3px solid #ff4d8d;
            outline-offset: 12px;
            border-radius: 24px;
        }
    </style>
</head>

<body>
    <a id="letter" href="https://www.youtube.com/watch?v=ysHa0S0esMA&list=RDGVZknrhCq1Q&index=2" target="_blank" rel="noopener noreferrer" aria-label="Open the link">💌</a>
</body>

</html>
